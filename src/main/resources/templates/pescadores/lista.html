<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pescadores')}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/layout :: topbar}"></header>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <main class="stack">
        <div class="page-head">
            <div>
                <span class="eyebrow">Cadastro</span>
                <h1>Pescadores</h1>
            </div>
            <a class="btn coral" th:href="@{/pescadores/novo}">+ Novo pescador</a>
        </div>

        <div class="grid">
            <article class="card" th:each="p, st : ${pescadores}">
                <div class="card-top">
                    <span class="avatar" th:classappend="'c' + ${st.index % 4}" th:text="${p.iniciais}">MP</span>
                    <div>
                        <h3 th:text="${p.nome}">Nome</h3>
                        <p class="sub" th:text="'CPF ' + ${p.cpf}">CPF</p>
                    </div>
                </div>
                <div class="divider"></div>
                <p class="meta">
                    <span th:text="${p.email != null ? p.email : 'Sem e-mail'}">e-mail</span><br>
                    <span th:text="${p.telefone != null ? p.telefone : 'Sem telefone'}">telefone</span>
                </p>
                <div class="actions">
                    <a class="btn ghost sm" th:href="@{/pescadores/{id}/editar(id=${p.id})}">Editar</a>
                    <form th:action="@{/pescadores/{id}/excluir(id=${p.id})}" method="post"
                          data-confirm="Excluir este pescador?">
                        <button type="submit" class="btn danger sm">Excluir</button>
                    </form>
                </div>
            </article>

            <a class="new-card" th:href="@{/pescadores/novo}">
                <span class="plus" aria-hidden="true">+</span>
                Adicionar pescador
            </a>
        </div>
    </main>
</div>
</body>
</html>
