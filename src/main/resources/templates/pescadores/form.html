<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pescador')}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <main class="split">
        <aside class="side">
            <span class="eyebrow">Cadastro</span>
            <h1 th:text="${pescador.id == null} ? 'Novo pescador' : 'Editar pescador'">Novo pescador</h1>
            <p>Informe os dados de quem vai registrar as pescarias.</p>
            <svg th:replace="~{fragments/layout :: waves}"></svg>
        </aside>

        <form class="form" th:action="@{/pescadores/salvar}" th:object="${pescador}" method="post" novalidate>
            <h2>Preencha os dados</h2>
            <input type="hidden" th:field="*{id}">

            <div class="fields">
                <div class="field" th:classappend="${#fields.hasErrors('nome')} ? 'invalid'">
                    <label for="nome">Nome completo <i>*</i></label>
                    <input type="text" th:field="*{nome}" maxlength="120" placeholder="Ex.: Matthäus de Paula">
                    <span class="err" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>
                <div class="field" th:classappend="${#fields.hasErrors('cpf')} ? 'invalid'">
                    <label for="cpf">CPF <i>*</i></label>
                    <input type="text" th:field="*{cpf}" maxlength="14" placeholder="000.000.000-00">
                    <span class="err" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></span>
                </div>
                <div class="field" th:classappend="${#fields.hasErrors('email')} ? 'invalid'">
                    <label for="email">E-mail</label>
                    <input type="email" th:field="*{email}" maxlength="120" placeholder="nome@email.com">
                    <span class="err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <div class="field" th:classappend="${#fields.hasErrors('telefone')} ? 'invalid'">
                    <label for="telefone">Telefone</label>
                    <input type="text" th:field="*{telefone}" maxlength="20" placeholder="(47) 90000-0000">
                    <span class="err" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></span>
                </div>
                <div class="field" th:classappend="${#fields.hasErrors('dataCadastro')} ? 'invalid'">
                    <label for="dataCadastro">Data de cadastro</label>
                    <input type="date" th:field="*{dataCadastro}">
                    <span class="err" th:if="${#fields.hasErrors('dataCadastro')}" th:errors="*{dataCadastro}"></span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn coral">Salvar</button>
                <a class="btn ghost" th:href="@{/pescadores}">Cancelar</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
