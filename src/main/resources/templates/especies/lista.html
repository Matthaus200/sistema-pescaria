<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Espécies')}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/layout :: topbar}"></header>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <main class="stack">
        <div class="page-head">
            <div>
                <span class="eyebrow">Cadastro</span>
                <h1>Espécies</h1>
            </div>
            <a class="btn coral" th:href="@{/especies/novo}">+ Nova espécie</a>
        </div>

        <div class="grid">
            <article class="card" th:each="e, st : ${especies}">
                <div class="card-top">
                    <span class="avatar" th:classappend="'c' + ${(st.index + 2) % 4}"
                          th:text="${#strings.toUpperCase(#strings.substring(e.nomePopular, 0, 1))}">T</span>
                    <div>
                        <h3 th:text="${e.nomePopular}">Nome</h3>
                        <p class="sub sci" th:text="${e.nomeCientifico != null ? e.nomeCientifico : 'Nome científico não informado'}">Nome científico</p>
                    </div>
                </div>
                <div class="chips">
                    <span class="chip teal" th:text="'Mínimo ' + ${@fmt.num(e.tamanhoMinimoCm)} + ' cm'">Mínimo 25 cm</span>
                    <span class="chip coral" th:if="${e.periodoDefeso != null}" th:text="'Defeso: ' + ${e.periodoDefeso}">Defeso</span>
                    <span class="chip" th:if="${e.periodoDefeso == null}">Sem defeso</span>
                </div>
                <div class="actions">
                    <a class="btn ghost sm" th:href="@{/especies/{id}/editar(id=${e.id})}">Editar</a>
                    <form th:action="@{/especies/{id}/excluir(id=${e.id})}" method="post"
                          data-confirm="Excluir esta espécie?">
                        <button type="submit" class="btn danger sm">Excluir</button>
                    </form>
                </div>
            </article>

            <a class="new-card" th:href="@{/especies/novo}">
                <span class="plus" aria-hidden="true">+</span>
                Adicionar espécie
            </a>
        </div>
    </main>
</div>
</body>
</html>
