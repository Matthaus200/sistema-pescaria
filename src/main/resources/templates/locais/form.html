<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Local de pesca')}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <main class="split">
        <aside class="side">
            <span class="eyebrow">Cadastro</span>
            <h1 th:text="${local.id == null} ? 'Novo local de pesca' : 'Editar local de pesca'">Novo local de pesca</h1>
            <p>Rios, lagos, represas, mar ou pesque-pague: cadastre o lugar onde a pescaria acontece.</p>
            <svg th:replace="~{fragments/layout :: waves}"></svg>
        </aside>

        <form class="form" th:action="@{/locais/salvar}" th:object="${local}" method="post" novalidate>
            <h2>Preencha os dados</h2>
            <input type="hidden" th:field="*{id}">

            <div class="fields">
                <div class="field" th:classappend="${#fields.hasErrors('nome')} ? 'invalid'">
                    <label for="nome">Nome <i>*</i></label>
                    <input type="text" th:field="*{nome}" maxlength="120" placeholder="Ex.: Rio Cubatão Norte">
                    <span class="err" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>
                <div class="field" th:classappend="${#fields.hasErrors('tipo')} ? 'invalid'">
                    <label for="tipo">Tipo <i>*</i></label>
                    <select th:field="*{tipo}">
                        <option value="">Selecione</option>
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.descricao}">Rio</option>
                    </select>
                    <span class="err" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></span>
                </div>
                <div class="field" th:classappend="${#fields.hasErrors('cidade')} ? 'invalid'">
                    <label for="cidade">Cidade <i>*</i></label>
                    <input type="text" th:field="*{cidade}" maxlength="80" placeholder="Ex.: Joinville">
                    <span class="err" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></span>
                </div>
                <div class="field" th:classappend="${#fields.hasErrors('estado')} ? 'invalid'">
                    <label for="estado">Estado <i>*</i></label>
                    <select th:field="*{estado}">
                        <option value="">Selecione</option>
                        <option th:each="uf : ${estados}" th:value="${uf}" th:text="${uf}">SC</option>
                    </select>
                    <span class="err" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></span>
                </div>
                <div class="field full">
                    <label for="descricao">Descrição</label>
                    <textarea th:field="*{descricao}" placeholder="Detalhes do local"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn coral">Salvar</button>
                <a class="btn ghost" th:href="@{/locais}">Cancelar</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
