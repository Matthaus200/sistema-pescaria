<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pescaria')}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <main class="split">
        <aside class="side">
            <span class="eyebrow">Diário de pesca</span>
            <h1 th:text="${pescaria.id == null} ? 'Nova pescaria' : 'Editar pescaria'">Nova pescaria</h1>
            <p>Escolha quem pescou, onde e com qual embarcação. As capturas são adicionadas depois, no detalhe da pescaria.</p>
            <svg th:replace="~{fragments/layout :: waves}"></svg>
        </aside>

        <form class="form" th:action="@{/pescarias/salvar}" th:object="${pescaria}" method="post" novalidate>
            <h2>Preencha os dados</h2>
            <input type="hidden" th:field="*{id}">

            <p class="hint" th:if="${#lists.isEmpty(pescadores) or #lists.isEmpty(locais)}">
                Antes de registrar uma pescaria, cadastre pelo menos um
                <a th:href="@{/pescadores/novo}">pescador</a> e um
                <a th:href="@{/locais/novo}">local de pesca</a>.
            </p>

            <div class="fields">
                <div class="field" th:classappend="${#fields.hasErrors('dataHora')} ? 'invalid'">
                    <label for="dataHora">Data e hora <i>*</i></label>
                    <input type="datetime-local" th:field="*{dataHora}">
                    <span class="err" th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}"></span>
                </div>
                <div class="field" th:classappend="${#fields.hasErrors('duracaoHoras')} ? 'invalid'">
                    <label for="duracaoHoras">Duração (horas)</label>
                    <input type="number" th:field="*{duracaoHoras}" min="0" step="0.5" placeholder="Ex.: 4,5">
                    <span class="err" th:if="${#fields.hasErrors('duracaoHoras')}" th:errors="*{duracaoHoras}"></span>
                </div>

                <!-- Os selects enviam o id; o Spring Data converte o id na entidade. -->
                <div class="field" th:classappend="${#fields.hasErrors('pescador')} ? 'invalid'">
                    <label for="pescador">Pescador <i>*</i></label>
                    <select id="pescador" name="pescador">
                        <option value="">Selecione o pescador</option>
                        <option th:each="x : ${pescadores}" th:value="${x.id}" th:text="${x.nome}"
                                th:selected="${pescaria.pescador != null and pescaria.pescador.id == x.id}">Nome</option>
                    </select>
                    <span class="err" th:if="${#fields.hasErrors('pescador')}" th:errors="*{pescador}"></span>
                </div>
                <div class="field" th:classappend="${#fields.hasErrors('localPesca')} ? 'invalid'">
                    <label for="localPesca">Local de pesca <i>*</i></label>
                    <select id="localPesca" name="localPesca">
                        <option value="">Selecione o local</option>
                        <option th:each="x : ${locais}" th:value="${x.id}" th:text="${x.nome}"
                                th:selected="${pescaria.localPesca != null and pescaria.localPesca.id == x.id}">Local</option>
                    </select>
                    <span class="err" th:if="${#fields.hasErrors('localPesca')}" th:errors="*{localPesca}"></span>
                </div>
                <div class="field">
                    <label for="embarcacao">Embarcação (opcional)</label>
                    <select id="embarcacao" name="embarcacao">
                        <option value="">Sem embarcação</option>
                        <option th:each="x : ${embarcacoes}" th:value="${x.id}" th:text="${x.nome}"
                                th:selected="${pescaria.embarcacao != null and pescaria.embarcacao.id == x.id}">Embarcação</option>
                    </select>
                </div>
                <div class="field" th:classappend="${#fields.hasErrors('clima')} ? 'invalid'">
                    <label for="clima">Clima</label>
                    <input type="text" th:field="*{clima}" maxlength="40" placeholder="Ex.: Nublado">
                    <span class="err" th:if="${#fields.hasErrors('clima')}" th:errors="*{clima}"></span>
                </div>
                <div class="field full">
                    <label for="observacoes">Observações</label>
                    <textarea th:field="*{observacoes}" placeholder="Anotações da saída"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn coral">Salvar</button>
                <a class="btn ghost"
                   th:href="${pescaria.id == null} ? @{/pescarias} : @{/pescarias/{id}(id=${pescaria.id})}">Cancelar</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
