spring.application.name=pescaria

# ------------------------------------------------------------------
# Banco de dados (PostgreSQL no Neon)
# Os dados de acesso vêm do arquivo db.properties, na raiz do projeto.
# Variáveis de ambiente com os mesmos nomes (DB_URL, DB_USERNAME,
# DB_PASSWORD) têm prioridade sobre o arquivo, se forem definidas.
# ------------------------------------------------------------------
spring.config.import=optional:file:./db.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# O plano gratuito do Neon aceita poucas conexões; um pool pequeno basta.
spring.datasource.hikari.maximum-pool-size=5

# Cria e atualiza as tabelas a partir das entidades.
spring.jpa.hibernate.ddl-auto=update
# Permite que as páginas Thymeleaf leiam os relacionamentos (ex.: pescaria.pescador.nome).
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Datas e números em português (ex.: "out" para outubro, "48,5 kg").
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Cadastra dados de exemplo quando o banco está vazio (veja config/DadosIniciais.java).
pescaria.dados-exemplo=true

server.port=8080
